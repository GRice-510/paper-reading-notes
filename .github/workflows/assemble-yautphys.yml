name: Assemble yautphys

on:
  push:
    paths:
      - '.yautphys-trigger'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble yautphys.bst
        shell: bash
        run: |
          cat .yautphys-parts/part-* | tr -d '\n' | base64 -d > yautphys.bst
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yautphys.bst
          git commit -m "Add yautphys bibliography style"
          git push
