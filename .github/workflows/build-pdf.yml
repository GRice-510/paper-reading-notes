name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.bst"
      - ".latexmkrc"
      - ".github/workflows/build-pdf.yml"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/**"
      - "web/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-reading-notes-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install HTML converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc
      - name: Validate sources, citations and HTML links
        run: python3 -m unittest discover -s tests -p test_html.py -v
      - name: Compile PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: 2026
          args: -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Prepare PDF and matching HTML edition
        shell: bash
        run: |
          cp main.pdf paper-reading-notes.pdf
          python3 scripts/build_html.py --output _site --revision "$GITHUB_SHA" \
            --source-date "$(git log -1 --format=%cI -- main.tex papers sections '*.bib')"
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: paper-reading-notes
          path: paper-reading-notes.pdf
          retention-days: 30
          if-no-files-found: error
      - name: Upload matching HTML and PDF site
        uses: actions/upload-artifact@v6
        with:
          name: paper-reading-notes-site
          path: _site
          retention-days: 7
          if-no-files-found: error
      - name: Commit latest PDF
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer source commit exists; skip committing this older PDF."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-reading-notes.pdf
          if git diff --cached --quiet; then
            echo "PDF is unchanged."
            exit 0
          fi
          git commit -m "chore: update generated PDF [skip ci]"
          git push origin HEAD:main
