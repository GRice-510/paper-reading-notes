name: Deploy Notes to Pages

on:
  workflow_run:
    workflows: ["Build PDF"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Build PDF run containing paper-reading-notes-site"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main for freshness check
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download the exact site built with the PDF
        uses: actions/download-artifact@v8
        with:
          name: paper-reading-notes-site
          path: _site
          run-id: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check source version and PDF integrity
        id: freshness
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('_site')
          m = json.loads((root / 'build-info.json').read_text())
          for name in ['paper-reading-notes.pdf', m['pdf_file']]:
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == m['pdf_sha256']
          assert m['source_revision'] in (root / 'index.html').read_text()
          assert m['paper_count'] == len(m['papers'])
          PY
          SOURCE_SHA="$(python3 -c 'import json; print(json.load(open("_site/build-info.json"))["source_revision"])')"
          if git diff --quiet "$SOURCE_SHA" HEAD -- '*.tex' '*.bib' '*.bst' .latexmkrc scripts web tests .github/workflows/build-pdf.yml .github/workflows/deploy-pages.yml; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Newer source files are present. Do not deploy this outdated snapshot."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
