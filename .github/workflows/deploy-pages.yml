name: Deploy PDF to Pages

on:
  workflow_run:
    workflows:
      - "Build PDF"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        run: |
          mkdir -p _site
          PAGE_VERSION="$(git rev-parse --short=12 HEAD)"
          VERSIONED_PDF="paper-reading-notes-${PAGE_VERSION}.pdf"

          # Keep the stable URL for bookmarks, but redirect the Pages root to a
          # versioned filename so browser/PDF-viewer caches cannot show an old PDF.
          cp paper-reading-notes.pdf _site/paper-reading-notes.pdf
          cp paper-reading-notes.pdf "_site/${VERSIONED_PDF}"

          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="pragma" content="no-cache">
            <meta http-equiv="expires" content="0">
            <meta http-equiv="refresh" content="0; url=${VERSIONED_PDF}">
            <title>Paper Reading Notes</title>
          </head>
          <body>
            <p><a href="${VERSIONED_PDF}">最新版PDFを開く</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
